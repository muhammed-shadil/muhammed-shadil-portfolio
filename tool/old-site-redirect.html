<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Muhammed Shadil | Flutter Developer</title>

  <!--
    OPTIONAL — this file is not part of the portfolio build.

    The portfolio used to be served from the `Shadil-Portfolio` repository.
    It now lives in `muhammed-shadil-portfolio`. Anything that already links
    to the old address (a resume, a LinkedIn profile, a sent application)
    would otherwise land on a stale copy of the site.

    To retire the old address cleanly:

      1. Clone https://github.com/muhammed-shadil/Shadil-Portfolio
      2. Delete its contents and drop in this file, renamed to index.html
      3. Commit and push

    Search engines follow the canonical link below to the new URL, so ranking
    accrues to the new address rather than being split between the two.
  -->
  <link rel="canonical" href="https://muhammed-shadil.github.io/muhammed-shadil-portfolio/">
  <meta http-equiv="refresh" content="0; url=https://muhammed-shadil.github.io/muhammed-shadil-portfolio/">
  <meta name="robots" content="noindex, follow">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #08080B;
      color: #A6A6B8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    a { color: #22D3EE; }
  </style>

  <script>
    location.replace('https://muhammed-shadil.github.io/muhammed-shadil-portfolio/');
  </script>
</head>
<body>
  <p>
    This portfolio has moved.<br>
    <a href="https://muhammed-shadil.github.io/muhammed-shadil-portfolio/">
      muhammed-shadil.github.io/muhammed-shadil-portfolio
    </a>
  </p>
</body>
</html>
