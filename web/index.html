<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced at build time by the `--base-href` argument. GitHub Pages serves a
    project site from a repository sub-path, so it MUST be built with the
    repository name:

      flutter build web --release --base-href "/muhammed-shadil-portfolio/"

    Leaving it as "/" makes every asset resolve against the domain root and the
    page loads blank with no error. The deploy workflow derives this from the
    repository name automatically, so renaming the repo cannot break it — see
    .github/workflows/deploy.yml.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="theme-color" content="#08080B">

  <title>Muhammed Shadil | Flutter Developer</title>
  <meta name="description" content="Portfolio of Muhammed Shadil, a Flutter Developer building modern mobile and web applications.">
  <meta name="author" content="Muhammed Shadil">
  <meta name="keywords" content="Muhammed Shadil, Flutter Developer, Dart, Mobile App Developer, Flutter Web, Firebase, BLoC, GetX, Calicut, Kerala, India, Cross-platform Developer">
  <meta name="robots" content="index, follow">

  <!-- Canonical URL. Update if the site moves to a custom domain. -->
  <link rel="canonical" href="https://muhammed-shadil.github.io/muhammed-shadil-portfolio/">

  <!-- Open Graph (LinkedIn, Facebook, Slack) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Muhammed Shadil">
  <meta property="og:title" content="Muhammed Shadil | Flutter Developer">
  <meta property="og:description" content="Senior Flutter Developer with 2.5+ years building production mobile and web applications — 10+ apps on the Play Store.">
  <meta property="og:url" content="https://muhammed-shadil.github.io/muhammed-shadil-portfolio/">
  <meta property="og:image" content="https://muhammed-shadil.github.io/muhammed-shadil-portfolio/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Muhammed Shadil — Flutter Developer">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Muhammed Shadil | Flutter Developer">
  <meta name="twitter:description" content="Senior Flutter Developer building production mobile and web applications with Flutter, Firebase and REST APIs.">
  <meta name="twitter:image" content="https://muhammed-shadil.github.io/muhammed-shadil-portfolio/og-image.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Muhammed Shadil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Two sizes so browsers pick a crisp one for the tab and for bookmark /
       home-screen tiles instead of scaling a single 32px bitmap up. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <link rel="manifest" href="manifest.json">

  <!--
    Structured data. Flutter Web renders to canvas, so crawlers cannot read the
    page text — this block is what search engines and rich results actually
    parse, and it is the main reason the site is indexable at all.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Muhammed Shadil",
    "jobTitle": "Senior Flutter Developer",
    "description": "Senior Flutter Developer with 2.5+ years of experience building scalable, high-performance mobile and web applications.",
    "url": "https://muhammed-shadil.github.io/muhammed-shadil-portfolio/",
    "email": "mailto:muhammedshadil220@gmail.com",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Calicut",
      "addressRegion": "Kerala",
      "addressCountry": "IN"
    },
    "sameAs": [
      "https://github.com/muhammed-shadil",
      "https://www.linkedin.com/in/muhammed-shadil-45973a28b/",
      "https://www.instagram.com/shadi_k_muhammed/"
    ],
    "knowsAbout": [
      "Flutter", "Dart", "Firebase", "REST API", "BLoC", "GetX",
      "Provider", "Clean Architecture", "Node.js", "Mobile App Development"
    ]
  }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #08080B;
      overflow: hidden;
    }

    /*
      Shown until Flutter paints its first frame, then removed by the
      bootstrap callback below. Without this the visitor stares at a black
      rectangle while the engine downloads.
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 20% 15%, #16102e 0%, #08080B 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.45s ease;
      z-index: 9999;
    }

    #boot.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* The real logo, so the loading mark and the tab icon are one mark.
       Neutral shadow: the artwork is grey on white, not a coloured tile. */
    .boot-mark {
      width: 62px;
      height: 62px;
      border-radius: 14px;
      display: block;
      box-shadow: 0 10px 34px -10px rgba(0, 0, 0, 0.8);
    }

    .boot-bar {
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.10);
      overflow: hidden;
    }

    .boot-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #8A8A8A, #FFFFFF);
      animation: boot-slide 1.15s ease-in-out infinite;
    }

    @keyframes boot-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }

    .boot-label {
      font-size: 12px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(166, 166, 184, 0.75);
    }

    /* Respect the visitor's motion preference for the loader too. */
    @media (prefers-reduced-motion: reduce) {
      .boot-bar span { animation: none; width: 100%; }
      #boot { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Crawler-readable content. Flutter paints over it; screen readers and
       search engines still see it in the initial HTML. -->
  <noscript>
    <h1>Muhammed Shadil — Senior Flutter Developer</h1>
    <p>
      Senior Flutter Developer based in Calicut, Kerala, India, with 2.5+ years
      of experience building scalable mobile and web applications with Flutter,
      Dart, Firebase and REST APIs. 10+ apps shipped to the Google Play Store.
    </p>
    <p>
      <a href="https://github.com/muhammed-shadil">GitHub</a> ·
      <a href="https://www.linkedin.com/in/muhammed-shadil-45973a28b/">LinkedIn</a> ·
      <a href="mailto:muhammedshadil220@gmail.com">muhammedshadil220@gmail.com</a>
    </p>
    <p>This site requires JavaScript to run.</p>
  </noscript>

  <div id="boot">
    <img class="boot-mark" src="icons/Icon-192.png" alt="Muhammed Shadil">
    <div class="boot-bar"><span></span></div>
    <div class="boot-label">Loading portfolio</div>
  </div>

  <script>
    // Remove the boot screen as soon as Flutter reports its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hidden');
      document.body.style.overflow = '';
      setTimeout(function () { boot.remove(); }, 500);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
