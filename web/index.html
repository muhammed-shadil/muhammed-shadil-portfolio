<!DOCTYPE html>

<head>

    the page loads blank.
  -->

  <!--

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #08080B;
      overflow: hidden;
    }

    /*
      Shown until Flutter paints its first frame, then removed by the
      bootstrap callback below. Without this the visitor stares at a black
      rectangle while the engine downloads.
    */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: radial-gradient(circle at 20% 15%, #16102e 0%, #08080B 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.45s ease;
      z-index: 9999;
    }

    #boot.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .boot-mark {
      width: 56px;
      height: 56px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0B0716;
      background: linear-gradient(135deg, #7C5CFF 0%, #22D3EE 100%);
      box-shadow: 0 10px 40px -8px rgba(124, 92, 255, 0.65);
    }

    .boot-bar {
      width: 132px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.10);
      overflow: hidden;
    }

    .boot-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #7C5CFF, #22D3EE);
      animation: boot-slide 1.15s ease-in-out infinite;
    }

    @keyframes boot-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }

    .boot-label {
      font-size: 12px;
      letter-spacing: 2.4px;
      text-transform: uppercase;
      color: rgba(166, 166, 184, 0.75);
    }

    /* Respect the visitor's motion preference for the loader too. */
    @media (prefers-reduced-motion: reduce) {
      .boot-bar span { animation: none; width: 100%; }
      #boot { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Crawler-readable content. Flutter paints over it; screen readers and
       search engines still see it in the initial HTML. -->
  <noscript>
    <h1>Muhammed Shadil — Senior Flutter Developer</h1>
    <p>
      Senior Flutter Developer based in Calicut, Kerala, India, with 2.5+ years
      of experience building scalable mobile and web applications with Flutter,
      Dart, Firebase and REST APIs. 10+ apps shipped to the Google Play Store.
    </p>
    <p>
      <a href="https://github.com/muhammed-shadil">GitHub</a> ·
      <a href="https://www.linkedin.com/in/muhammed-shadil-45973a28b/">LinkedIn</a> ·
      <a href="mailto:muhammedshadil220@gmail.com">muhammedshadil220@gmail.com</a>
    </p>
    <p>This site requires JavaScript to run.</p>
  </noscript>

  <div id="boot">
    <div class="boot-mark">MS</div>
    <div class="boot-bar"><span></span></div>
    <div class="boot-label">Loading portfolio</div>
  </div>

  <script>
    // Remove the boot screen as soon as Flutter reports its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hidden');
      document.body.style.overflow = '';
      setTimeout(function () { boot.remove(); }, 500);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
