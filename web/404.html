<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Muhammed Shadil | Flutter Developer</title>
  <!--
    GitHub Pages serves this for any unknown path. The site is a single page,
    so send the visitor to the root rather than showing GitHub's 404.
    `replace` keeps the bad URL out of the back-button history.
  -->
  <script>
    location.replace('/Shadil-Portfolio/');
  </script>
  <meta http-equiv="refresh" content="0; url=/Shadil-Portfolio/">
</head>
<body>
  <p>Redirecting to <a href="/Shadil-Portfolio/">muhammed-shadil.github.io/Shadil-Portfolio</a>…</p>
</body>
</html>
